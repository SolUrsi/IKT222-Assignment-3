{% extends "base.html" %}

{% block title %}Enable 2FA{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-6 bg-gray-800 rounded-lg shadow-xl text-white">
    <h1 class="text-2xl font-bold mb-4 text-emerald-400">Enable Two-Factor Authentication</h1>
    
    <p class="mb-4">
        1. Scan the QR code below with your authenticator app (Google Authenticator, Authenticator, Authy, etc.).
    </p>

    <div class="text-center my-6 p-4 bg-white rounded-lg inline-block">
        <img src="{{ qr_data_url }}" alt="2FA QR Code">
    </div>

    <form method="POST">
        <label for="token" class="block text-sm font-medium mb-2">
            2. Enter the 6-digit code from the app:
        </label>
        <input type="text" id="token" name="token" required 
               class="w-full p-3 border border-gray-600 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:ring-emerald-500 focus:border-emerald-500 text-center text-xl tracking-widest" 
               maxlength="6" autocomplete="off" inputmode="numeric">
        
        <button type="submit" class="w-full mt-4 px-4 py-2 bg-emerald-600 text-white font-semibold rounded-lg hover:bg-emerald-700 transition">
            Verify & Activate 2FA
        </button>
    </form>
</div>
{% endblock %}
