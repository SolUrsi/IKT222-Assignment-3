<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>{% block title %}{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Tailwind CSS because I'm lazy (sorry)-->
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /* Shift content to right to prevent it from being hidden behind the fixed */
            body {
                padding-left: 4rem; 
            }
        </style>
    </head>
    <body class="min-h-screen flex flex-col">
        <nav>
            <div class="flex navbar">
                <div class="fixed top-0 left-0 h-screen w-16 m-0 flex flex-col bg-gray-900 text-white shadow-lg z-50">
                    
                    <div class="flex-none flex flex-col items-center mb-4">
                        <a href="{{ url_for('index')}}" class="
                                group flex flex-col items-center justify-center 
                                h-16 w-16 p-2 rounded-lg 
                                hover:bg-gray-700 
                                transition duration-300" 
                            title="Home">
                            
                            <span class="
                                text-xs font-semibold 
                                text-gray-300 
                                group-hover:text-white">
                                Home
                            </span>
                        </a>
                    </div>

                    <ul class="flex-none flex flex-col items-center mb-4">
                        {% block sidebar_links %}
                            <li>
                                <a href="{{ url_for('signup')}}" class="
                                    group flex flex-col items-center justify-center 
                                    h-16 w-16 p-2 rounded-lg 
                                    hover:bg-gray-700 
                                    transition duration-300" 
                                    title="Sign Up">
                                    
                                    <span class="
                                        text-xs font-semibold 
                                        text-gray-300 
                                        group-hover:text-green-400">
                                        Sign Up
                                    </span>
                                </a>
                            </li>
                            
                            <li>
                                <a href="{{ url_for('login')}}" class="
                                    group flex flex-col items-center justify-center 
                                    h-16 w-16 p-2 rounded-lg 
                                    hover:bg-gray-700 
                                    transition duration-300" 
                                    title="Log In">
                                    
                                    <span class="
                                        text-xs font-semibold 
                                        text-gray-300 
                                        group-hover:text-blue-400">
                                        Log In
                                    </span>
                                </a>
                            </li>
                        {% endblock %}
                    </ul>
                </div>
            </div>
        </nav>
        
        <main class="flex-grow p-4 sm:p-6 lg:p-8">
            <div class="max-w-4xl mx-auto">
                
                <div class="bg-white p-6 rounded-xl shadow-lg">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </main>

        <footer class="bg-gray-800 text-white">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-400">
                &copy; 2025 Super Secret Chatroom | IKT222 Assignment 3
            </div>
        </footer>
    </body>
</html>
