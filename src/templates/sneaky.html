{% extends "base.html" %}

{% block title %}Gotcha!{% endblock %}

{% block content %}
<div class="text-center">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-4">You know the rules, and so do I.</h1>
    <p class="text-lg text-gray-600 mb-6">You shouldn't be here... Say goodbye!</p>
    
    <!-- Rick Astley (genius I know) -->
    <div class="aspect-w-16 aspect-h-9 rounded-lg overflow-hidden shadow-2xl">
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
</div>

<!-- Aids responsive video embeds -->
<style>
    .aspect-w-16 { position: relative; padding-bottom: 56.25%; }
    .aspect-h-9 { height: 0; }
    .aspect-w-16 > iframe, .aspect-h-9 > iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
</style>
{% endblock %}
