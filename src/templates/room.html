{% extends "base.html" %}

{% block title %}Secret Chat Room{% endblock %}

{% block content %}
<div class="flex flex-col h-[75vh]">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Welcome to the Secret Chamber, <span class="text-indigo-600">{{ current_user.username }}</span>!</h1>
    
    <!-- Message Display Area -->
    <div id="messages" class="flex-grow bg-gray-100 rounded-lg p-4 overflow-y-auto mb-4 border border-gray-200">
        <!-- Messages will be dynamically inserted here -->
        <div class="text-center text-gray-500 italic">Loading messages...</div>
    </div>

    <!-- Message Input Form -->
    <form id="message-form" class="flex items-center">
        <input type="text" id="message-input" placeholder="Type your secret message..." autocomplete="off" class="flex-grow p-3 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        <button type="submit" class="bg-indigo-600 text-white p-3 rounded-r-lg hover:bg-indigo-700 transition font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
        </button>
    </form>
</div>

<!-- Socket.IO client library -->
<script src="https://cdn.socket.io/4.5.2/socket.io.min.js"></script>
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
        // Connect to the Socket.IO server
        const socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port);

        const messagesContainer = document.getElementById('messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');

        // Function to append a message to the chat window
        const addMessage = (msg) => {
            const messageElement = document.createElement('div');
            messageElement.classList.add('p-2', 'rounded-lg', 'mb-2', 'max-w-lg', 'break-words');

            // Style messages from the current user differently
            if (msg.username === "{{ current_user.username }}") {
                messageElement.classList.add('bg-indigo-500', 'text-white', 'self-end', 'ml-auto');
            } else {
                messageElement.classList.add('bg-white', 'text-gray-800', 'self-start', 'mr-auto', 'shadow-sm');
            }
            
            messageElement.innerHTML = `<strong class="font-bold">${msg.username}</strong><p class="text-sm">${msg.text}</p><span class="text-xs text-gray-400 float-right ml-2">${msg.timestamp}</span>`;
            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight; // Auto-scroll to bottom
        };

        // Clear the 'loading' message on connect
        socket.on('connect', () => {
            console.log('Socket.IO connected!');
            messagesContainer.innerHTML = ''; 
        });

        // Listen for 'load_messages' event to display chat history
        socket.on('load_messages', (data) => {
            messagesContainer.innerHTML = '';
            data.messages.forEach(addMessage);
        });

        // Listen for 'new_message' event to display incoming messages
        socket.on('new_message', addMessage);

        // Send a message when the form is submitted
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (message) {
                socket.emit('send_message', { text: message });
                messageInput.value = '';
                messageInput.focus();
            }
        });
    });
</script>
<style>
    #messages {
        display: flex;
        flex-direction: column;
    }
</style>
{% endblock %}
